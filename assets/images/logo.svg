<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#C68212" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Modern Dynamic Energy Emblem (Oil Droplet + Wing Flight) -->
  <g transform="translate(10, 10)">
    <!-- Base outer wing / oil arc -->
    <path d="M 40 5 C 62 5, 78 22, 78 45 C 78 68, 58 82, 40 82 C 22 82, 2 68, 2 45 C 2 28, 20 12, 40 5 Z" 
          fill="url(#blueGlow)" opacity="0.15" />
    
    <!-- Primary Golden Wing / Flame Blade -->
    <path d="M 40 6 C 56 16, 70 32, 72 50 C 74 66, 62 78, 46 80 C 60 72, 64 56, 56 42 C 50 32, 42 22, 40 6 Z" 
          fill="url(#goldGrad)" />
          
    <!-- Secondary Sweeping Blade -->
    <path d="M 32 16 C 44 26, 52 40, 52 56 C 52 68, 42 77, 30 78 C 40 71, 44 58, 38 46 C 34 36, 30 26, 32 16 Z" 
          fill="url(#goldGrad)" opacity="0.8" />
          
    <!-- Core Blue Drop of Energy -->
    <path d="M 24 35 C 32 44, 36 53, 36 62 C 36 72, 28 78, 20 78 C 12 78, 4 72, 4 62 C 4 52, 14 42, 24 35 Z" 
          fill="url(#blueGlow)" />
          
    <circle cx="21" cy="62" r="4" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Brand Typography -->
  <text x="105" y="52" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    PETRO<tspan fill="url(#goldGrad)">GANSO</tspan>
  </text>
  <text x="108" y="74" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.8" fill="#94A3B8">
    ENERGY &amp; COMMODITIES • PANAMA
  </text>
</svg>
